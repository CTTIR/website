baseURL = "https://cttir.github.io/website/"
languageCode = "en-us"
title = "CTTIR"
defaultContentLanguage = "en"
enableEmoji = true

[pagination]
  pagerSize = 20

[module]
  [[module.imports]]
    path = "github.com/luizdepra/hugo-coder"

[markup.goldmark.renderer]
  unsafe = true

[params]
  author = "CTTIR"
  HeadTitle = "CTTIR — Computational Trauma and Tissue Injury Research"
  info = ["Computational", "Trauma and Tissue", "Injury Research"]
  description = "CTTIR — Computational Trauma and Tissue Injury Research. Open-source tools, tutorials, and resources."
  keywords = "trauma,tissue injury,computational biology,bioinformatics,R,research"
  avatarURL = "images/cttir-mark.svg"
  avatarDarkURL = "images/cttir-mark-dark.svg"
  faviconSVG = "images/favicon.svg"
  favicon_32 = "images/favicon-32.png"
  favicon_16 = "images/favicon-16.png"
  touchicon = "images/apple-touch-icon.png"
  manifest = "site.webmanifest"
  since = 2025
  enableTwemoji = false
  colorScheme = "auto"
  hideColorSchemeToggle = false
  customCSS = ["css/custom.css"]

  [[params.social]]
    name = "GitHub"
    icon = "fa-brands fa-github fa-2x"
    weight = 1
    url = "https://github.com/CTTIR"

