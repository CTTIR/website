# Software catalogue.
# Rendered by layouts/software/list.html, grouped by `category` then, for
# R Packages, sub-grouped by `group` (see the group order in that template).
# Cards with an empty `logo` fall back to a monochrome, name-inside outline
# whose shape encodes the category: hexagon = R package, pentagon = Zotero
# plugin, square = application.
# `status` sets the three-dot maturity indicator on each card:
#   cran = ●●● (fully functional, on CRAN)  usable = ●●○  draft = ●○○  idea = ○○○

