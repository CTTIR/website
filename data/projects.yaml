# Research-theme projects. Cross-links resolve to:
#   Software cards: /software/#<packageName>
#   Workflow cards: /projects/#<slug> (Projects & Workflows page)

# TODO: Add a project hero image / illustration once available.
- name: "Single-Cell Analysis"
  slug: single-cell-analysis
  hidden: true
  weight: 10
  description: "<em>Cellular composition and state in injured and healthy tissue.</em> CTTIR develops methods and software for end-to-end single-cell analysis — from raw counts through QC, embedding, segmentation-aware spatial context, and publication-ready cell-level reporting."
  software:
    - { pkg: cellreportR, note: "publication-ready cell-level reports" }
    - { pkg: scimagR,     note: "single-cell imaging integration" }
    - { pkg: segmantR,    note: "segmentation utilities, cell annotation, and mask correction" }
    - { pkg: bambamR,     note: "bulk reference profiles for calibration" }
    - { pkg: songR,       note: "interpretable embeddings" }
  workflows:
    - { slug: single-cell-tissue-atlas,      title: "Single-Cell Tissue Atlas" }
    - { slug: multimodal-tissue-integration, title: "Multi-Modal Tissue Integration", note: "(includes single-cell)" }

# TODO: Add a project hero image / illustration once available.
- name: "Hyperspectral Imaging"
  slug: hsi
  weight: 10
  description: "<em>Label-free tissue characterization from spectral signatures.</em> The hyperloom suite brings together CTTIR's hyperspectral packages: camera-specific readers for Cubert and TIVITA data, a common spectral cube with preprocessing and analysis, and spectral visualisation."
  software:
    - pkg: hyperloom
      note: "suite package for CTTIR hyperspectral imaging"
    - pkg: cuvis.r
      note: "reading Cubert hyperspectral measurements"
    - pkg: tivis.r
      note: "reading TIVITA hyperspectral recordings"
    - pkg: hyperspectR
      note: "spectral cubes, preprocessing and analysis"
    - pkg: hyperspectaculR
      note: "spectral visualisation"
  workflows:
    - slug: hsi-tissue-characterization
      title: "Hyperspectral Tissue Characterization"

- name: "Cross-Modal Integration"
  slug: cross-modal-integration
  hidden: true
  weight: 30
  description: "<em>Aligning high-dimensional modalities — imaging, single-cell, bulk omics, multiplex protein, molecular pathology — into a coherent translational view.</em> CTTIR's flagship integration theme: methods and software for harmonizing heterogeneous data into shared representations, with cohort-level inference and interactive exploration. Connects assay-level processing to translational inference end-to-end."
  software:
    - { pkg: hyperspectR, note: "modality-specific ingest and processing" }
    - { pkg: cellreportR, note: "cell-level reporting" }
    - { pkg: bambamR,     note: "bulk RNA-seq processing" }
    - { pkg: segmantR,    note: "segmentation utilities and histology region-of-interest annotation" }
    - { pkg: hyperannotatR, note: "HSI region-of-interest annotation" }
    - { pkg: scimagR,     note: "single-cell imaging integration" }
    - { pkg: qviewparsR,  note: "multiplex protein parsing" }
    - { pkg: pressR,      note: "cohort reporting" }
    - { pkg: molpathR,    note: "molecular pathology cohort assembly and interactive exploration" }
    - { pkg: zhncommandR, note: "haematological-oncology cohort audit dashboard" }
    - { pkg: songR,       note: "joint interpretable embeddings across modalities" }
    - { pkg: dynasimR,    note: "synthetic ground truth for integration benchmarking" }
  workflows:
    - { slug: multimodal-tissue-integration, title: "Multi-Modal Tissue Integration", note: "(flagship)" }
    - { slug: multiplex-protein-cohort,      title: "Multiplex Protein Quantification & Cohort Analysis" }
    - { slug: molecular-pathology-cohort,    title: "Molecular Pathology Cohort" }
    - { slug: bulk-transcriptomic-response,  title: "Bulk Transcriptomic Response" }

# TODO: Add a project hero image / illustration once available.
- name: "Basic Bioinformatics"
  slug: basic-bioinformatics
  hidden: true
  weight: 40
  description: "<em>Foundational methods, benchmarking, and reproducibility infrastructure.</em> The methodological backbone of CTTIR's applied work: interpretable dimensionality reduction, RNA-seq fundamentals, simulation-based benchmarking, and reproducible reporting templates that the applied projects build on."
  software:
    - { pkg: songR,    note: "SONG dimensionality reduction" }
    - { pkg: bambamR,  note: "RNA-seq pipeline fundamentals" }
    - { pkg: dynasimR, note: "synthetic ground-truth simulation" }
    - { pkg: reflowR,  note: "reproducible report themes" }
    - { pkg: hexmakR,  note: "package branding utilities" }
  workflows:
    - { slug: bulk-transcriptomic-response, title: "Bulk Transcriptomic Response" }
    - { slug: method-benchmarking,          title: "Method Benchmarking on Synthetic Ground Truth" }
    - { slug: cttir-site-template,           title: "Templating a CTTIR-Styled Reproducible Site" }
- name: "Spatial Biology"
  slug: spatial-biology
  weight: 20
  description: "<em>Cells in their tissue context.</em> The phenoloom suite brings together CTTIR's spatial biology packages: cell segmentation, single-cell profiles, gating of cell populations and spatial neighbourhood analysis."
  software:
    - pkg: phenoloom
      note: "suite package for CTTIR spatial biology"
    - pkg: segmantR
      note: "cell segmentation and mask correction"
    - pkg: cellspecR
      note: "single-cell profiles"
    - pkg: gatekeepR
      note: "gating cell populations"
    - pkg: phenoscapR
      note: "spatial neighbourhoods"
  workflows:
    - slug: spatial-tissue-phenotyping
      title: "Spatial Tissue Phenotyping"
