- name: "Spatial Tissue Phenotyping — From Images to Cell Neighbourhoods"
  slug: spatial-tissue-phenotyping
  weight: 20
  status: "Walkthrough"
  research_question: "Which cell populations are present in a tissue section, and how are they arranged relative to each other?"
  description: "Executed walkthrough of the phenoloom suite on a synthetic seven-channel immunofluorescence section: segmantR segments nuclei and cells, cellspecR turns the measurements into a validated, checksummed cell table, gatekeepR estimates marker cut-offs and assigns cell types, and phenoscapR maps neighbour enrichment, distances and cellular neighbourhoods. Each step is checked against the drawn ground truth."
  featured_packages: [phenoloom, segmantR, cellspecR, gatekeepR, phenoscapR]
  learn:
    - "Segmenting nuclei by watershed and growing them into cells with segmantR, scored against known nuclei"
    - "Reading segmantR features into a validated, checksummed cell table with cellspecR"
    - "Declaring a marker panel and phenotype hierarchy in gatekeepR, with an unstained marker reported as not callable"
    - "Testing which cell types sit together and finding cellular neighbourhoods with phenoscapR"
    - "Checking every step against the ground truth of a synthetic image"
