# Workflow tiles on Projects & Workflows. A tile links to its executed walkthrough at
# content/projects/<slug>/ (rendered by tools/walkthroughs/render.R) when one exists.

- name: "Single-Cell Tissue Atlas — From Raw Counts to Annotated Atlas"
  slug: single-cell-tissue-atlas
  hidden: true
  weight: 10
  status: "Coming soon"
  research_question: "Which cell populations and states characterize injured vs. healthy tissue, and how do they relate to spatial context?"
  description: "End-to-end single-cell workflow on a synthetic injured-tissue dataset: QC, normalization, clustering, annotation, segmentation-derived spatial context, and a publication-ready cell-level report. Demonstrates the CTTIR single-cell stack composed end-to-end."
  featured_packages: [cellreportR, scimagR, segmantR, bambamR, songR]
  learn:
    - "Scaffolding a reproducible single-cell project with workflowr"
    - "QC, normalization, and SONG-based embeddings (songR) for interpretable structure"
    - "Linking segmentation (segmantR) and cell imaging (scimagR) outputs to expression data"
    - "Producing publication-ready cell-level reports with cellreportR"
    - "Cross-referencing bulk reference profiles via bambamR for population calibration"

- name: "Hyperspectral Tissue Characterization — From Spectral Cube to Tissue Class Map"
  slug: hsi-tissue-characterization
  weight: 10
  status: "Walkthrough"
  research_question: "Can tissue regions be told apart by their reflectance spectra alone, and which spectral features separate them?"
  description: "Executed walkthrough of the hyperloom suite: read a TIVITA recording with tivis.r and check the Cubert SDK through cuvis.r, then preprocess, fit hemoglobin, embed and classify simulated tissue scenes with hyperspectR, holding out whole scenes, and summarise the cube with hyperspectaculR. The data are synthetic with a known answer, so every step can be checked."
  featured_packages: [hyperloom, tivis.r, cuvis.r, hyperspectR, hyperspectaculR]
  learn:
    - "Reading TIVITA recordings and metadata into an hsi_cube with tivis.r"
    - "Reusable preprocessing recipes (Savitzky–Golay and SNV) with hyperspectR"
    - "Hemoglobin fitting and band ratios, checked against known simulated values"
    - "PCA embeddings whose loadings read as spectra, and unsupervised region recovery"
    - "SVM classification evaluated with whole scenes held out"

- name: "Multiplex Protein Quantification — From Plate Images to Cohort Inference"
