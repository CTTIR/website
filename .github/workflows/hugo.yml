name: Check and deploy Hugo site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily rebuild so the version and last-update lines on the software
    # cards follow the package repositories.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.150.0
      HUGO_DEB_SHA256: 29c6e94a17e5e8075df80115777e5ee68724c25fa3a689697514a212fe53b29c
      GOMAXPROCS: 2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "$HUGO_DEB_SHA256  $RUNNER_TEMP/hugo.deb" | sha256sum --check
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test local link validation
        run: python3 -m unittest discover -s tests -v
      - name: Refresh software versions and update dates
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_software_meta.py
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify
          hugo mod verify
          git diff --exit-code -- go.mod go.sum
          python3 tools/check_site.py public
      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
